name: Build AutoCua Rust EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build Windows x64 executable
    runs-on: windows-latest
    steps:
      - name: Check out repository and upstream AutoCua submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --manifest-path rust-launcher/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Create checksum
        shell: pwsh
        run: |
          $exe = "rust-launcher/target/x86_64-pc-windows-msvc/release/autocua.exe"
          if (!(Test-Path $exe)) { throw "Build did not create $exe" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash  autocua.exe" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AutoCua-Windows-x64
          path: |
            rust-launcher/target/x86_64-pc-windows-msvc/release/autocua.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust-launcher/target/x86_64-pc-windows-msvc/release/autocua.exe
            SHA256SUMS.txt
          generate_release_notes: true
