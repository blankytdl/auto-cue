name: Build AutoCua Llama Prism Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autocua-llama-prism-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-update:
    name: Build dependency-free update for existing portable install
    runs-on: windows-latest
    steps:
      - name: Check out repository and pinned upstream AutoCua source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch AutoCua's Ollama adapter for llama.cpp / Llama Prism
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\patches\enable-llama-prism.ps1

      - name: Package only the changed Python module and updater
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $PWD "dist\AutoCua-LlamaPrism-Update"
          $payload = Join-Path $bundle "payload\runtime\Lib\site-packages\AutoCua\llm_provider\ollama"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          # This is an overlay for the existing 480 MB portable build. It
          # includes only the changed Python adapter, not Python, DLLs,
          # installed packages, the Rust binary, or the previous runtime.
          Copy-Item "AutoCua\AutoCua\llm_provider\ollama\service.py" (Join-Path $payload "service.py") -Force
          Copy-Item "patches\Apply-LlamaPrism-Update.ps1" (Join-Path $bundle "Apply-LlamaPrism-Update.ps1") -Force

          @"
          AutoCua Llama Prism incremental update
          ======================================

          This ZIP is an UPDATE for an existing AutoCua-Windows-x64-Portable
          installation. It deliberately does NOT contain Python, DLLs,
          pip packages, the Rust launcher, or any other runtime dependency.

          1. Extract this ZIP to a temporary folder.
          2. Run Apply-LlamaPrism-Update.ps1.
          3. When asked, enter the folder containing your existing autocua.exe.
          4. The script backs up the old Ollama adapter and copies only the
             updated service.py into your existing runtime.

          Configure the local Llama Prism endpoint in:
            %APPDATA%\AutoCua_data\.env

          Add:
            OLLAMA_HOST=127.0.0.1:8080

          Start llama-prism / llama-server with a tool-aware chat template
          (normally --jinja), then restart AutoCua. In Settings → Model
          Selection choose provider "ollama" and select the model ID returned
          by http://127.0.0.1:8080/v1/models.

          Screen control also needs a vision-capable model and its matching
          mmproj. Tool calls need a compatible tool-use chat template.

          To roll back, restore the .bak file created beside service.py.
          "@ | Set-Content -Encoding utf8 (Join-Path $bundle "README.txt")

          $zip = Join-Path $PWD "AutoCua-LlamaPrism-Update.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$bundle\*" -DestinationPath $zip -CompressionLevel Optimal

          $size = (Get-Item $zip).Length
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  AutoCua-LlamaPrism-Update.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
          Write-Host "Created dependency-free update: $size bytes"
          if ($size -gt 2MB) { throw "Update unexpectedly exceeds 2 MB; a runtime may have been included." }

      - name: Upload dependency-free update
        uses: actions/upload-artifact@v4
        with:
          name: AutoCua-LlamaPrism-Update
          path: |
            AutoCua-LlamaPrism-Update.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
