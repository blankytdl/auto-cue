[package]
name = "autocua-rust-launcher"
version = "0.1.0"
edition = "2021"
description = "Native Rust Windows bootstrapper for the AutoCua desktop agent"
license = "MIT"

[[bin]]
name = "autocua"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
